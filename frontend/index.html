<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nightwatch · Stargazing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>

  <body class="bg-night font-sans text-moon">
    <main
      class="relative min-h-screen overflow-hidden bg-[radial-gradient(ellipse_at_30%_20%,#1b2457_0%,#0b1026_55%,#05070f_100%)]"
    >
      <!-- ============ BACKGROUND IMAGES ============
           Decorative only, so every image has alt="" and sits in an
           aria-hidden, click-through layer. Adjust position (top/left/right/
           bottom) and size (w-*) on each <img> to taste. Classes like
           "hidden sm:block" hide an image on small screens. -->
      <div aria-hidden="true" class="pointer-events-none absolute inset-0 select-none">
        <!-- Shooting stars: fly across periodically. Different durations and
             delays keep them from syncing up. -->
        <img src="/src/assets/shooting_star.png" alt="" draggable="false" class="absolute left-0 top-[8%] w-20 animate-shoot motion-reduce:hidden sm:w-24" style="animation-duration: 22s; animation-delay: 3s" />
        <img src="/src/assets/shooting_star.png" alt="" draggable="false" class="absolute left-0 top-[35%] w-16 animate-shoot motion-reduce:hidden sm:w-20" style="animation-duration: 31s; animation-delay: 12s" />
        <img src="/src/assets/shooting_star.png" alt="" draggable="false" class="absolute left-0 top-[60%] w-24 animate-shoot motion-reduce:hidden sm:w-28" style="animation-duration: 27s; animation-delay: 20s" />

        <!-- Moon and galaxy -->
        <img src="/src/assets/moon.png" alt="" draggable="false" class="absolute right-[18%] top-[9%] hidden w-24 sm:block" />
        <img src="/src/assets/galaxy.png" alt="" draggable="false" class="absolute bottom-[14%] left-[40%] w-44" />

        <!-- Planets -->
        <img src="/src/assets/planet1.png" alt="" draggable="false" class="absolute left-[7%] top-[44%] hidden w-28 sm:block" />
        <img src="/src/assets/planet2.png" alt="" draggable="false" class="absolute bottom-[8%] right-[10%] w-28 sm:w-32" />

        <!-- Stars -->
        <img src="/src/assets/star_blue.png" alt="" draggable="false" class="absolute left-[38%] top-[6%] w-12" />
        <img src="/src/assets/star_green.png" alt="" draggable="false" class="absolute right-[32%] top-[64%] hidden w-12 md:block" />
        <img src="/src/assets/star_purple.png" alt="" draggable="false" class="absolute left-[22%] top-[24%] hidden w-10 md:block" />
        <img src="/src/assets/star_yellow.png" alt="" draggable="false" class="absolute bottom-[30%] left-[12%] hidden w-10 md:block" />

        <!-- Asteroids -->
        <img src="/src/assets/asteroid1.png" alt="" draggable="false" class="absolute bottom-[18%] right-[24%] hidden w-20 sm:block" />
        <img src="/src/assets/asteroid2.png" alt="" draggable="false" class="absolute bottom-[10%] left-[26%] w-10 sm:w-12" />
        <img src="/src/assets/asteroid3.png" alt="" draggable="false" class="absolute right-[6%] top-[14%] hidden w-14 sm:block" />
      </div>

      <!-- ============ NAV BUTTONS (scattered) ============ -->
      <nav aria-label="Main">
        <!-- Top left -->
        <a href="/tips.html" class="orb group absolute left-5 top-5 sm:left-10 sm:top-8">
          <span class="orb-disc">
            <svg class="size-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V17h5v-1.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" />
              <path d="M10 20.5h4" />
            </svg>
          </span>
          <span class="orb-label">Tips</span>
        </a>

        <!-- Middle right: opens the dark skies map dialog -->
        <button type="button" id="map-open" class="orb group absolute right-5 top-1/2 -translate-y-1/2 sm:right-10">
          <span class="orb-disc">
            <svg class="size-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z" />
              <circle cx="12" cy="10" r="2.3" />
            </svg>
          </span>
          <span class="orb-label">Find dark skies</span>
        </button>

        <!-- Bottom left -->
        <button type="button" id="events-open" class="orb group absolute bottom-5 left-5 sm:bottom-10 sm:left-16">
          <span class="orb-disc">
            <svg class="size-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="5" width="16" height="15" rx="2" />
              <path d="M4 10h16M9 3v4M15 3v4" />
            </svg>
          </span>
          <span class="orb-label">Sky events</span>
        </button>
      </nav>

      <!-- ============ TITLE BOX ============ -->
      <header class="relative z-10 flex min-h-screen items-center justify-center px-6">
        <div class="max-w-xl rounded-3xl border border-moon/20 bg-night/60 px-10 py-12 text-center backdrop-blur-md">
          <h1 class="font-display text-5xl font-semibold tracking-tight sm:text-6xl">Nightwatch</h1>
          <p class="mx-auto mt-4 max-w-sm text-lg text-moon/75">
            Find a dark sky near you and know what to look for when you get there.
          </p>
        </div>
      </header>
    </main>

    <!-- ============ SKY EVENTS (Astronomy.com "Sky This Week" feed) ============ -->
    <dialog
      id="events-dialog"
      aria-labelledby="events-title"
      class="m-auto h-[min(85vh,720px)] w-[min(92vw,720px)] overflow-hidden rounded-2xl bg-night p-0 text-moon backdrop:bg-black/70"
    >
      <div class="flex h-12 items-center justify-between border-b border-moon/15 px-4">
        <p id="events-title" class="font-medium">Sky events this month</p>
        <div class="flex items-center gap-4 text-sm">
          <a id="events-external" href="#" target="_blank" rel="noopener" class="text-aurora underline underline-offset-4">More on Astronomy.com</a>
          <button type="button" id="events-close" class="rounded-md border border-moon/30 px-3 py-1 hover:border-aurora hover:text-aurora">Close</button>
        </div>
      </div>
      <div class="h-[calc(100%-3rem)] overflow-y-auto px-5 py-6 sm:px-8">
        <p id="events-status" role="status" class="text-moon/75"></p>
        <ol id="events-list"></ol>
        <p class="mt-6 text-sm text-moon/50">Source: Astronomy magazine’s “Sky This Week.”</p>
      </div>
    </dialog>

    <!-- ============ DARK SKIES MAP ============ -->
    <dialog
      id="map-dialog"
      aria-labelledby="map-title"
      class="m-auto h-[min(88vh,800px)] w-[min(94vw,1100px)] overflow-hidden rounded-2xl bg-night p-0 text-moon backdrop:bg-black/70"
    >
      <div class="flex h-12 items-center justify-between border-b border-moon/15 px-4">
        <p id="map-title" class="font-medium">Dark skies near you</p>
        <button
          type="button"
          id="map-close"
          aria-label="Close map"
          class="flex size-8 items-center justify-center rounded-md border border-moon/30 hover:border-aurora hover:text-aurora"
        >
          ✕
        </button>
      </div>
      <iframe
        id="map-frame"
        title="Map of areas with low light pollution"
        class="h-[calc(100%-3rem)] w-full bg-night"
      ></iframe>
    </dialog>
  </body>
</html>
